services:
  - type: web
    name: legal-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APPLICATION_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: "./storage/uploads"
      - key: DATABASE_URL
        fromDatabase:
          name: legal-ai-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: MAX_OUTPUT_TOKENS
        value: "2048"
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: legal-ai-postgres
    databaseName: legal_assistant
    user: legal_user
    plan: free
    region: oregon
