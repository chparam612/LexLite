[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ai-backend"
version = "0.1.0"
description = "FastAPI backend for LEGAL AI — Assistance & Access Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24.0",
    "google-generativeai>=0.7.0",
    "firebase-admin>=6.5.0",
    "numpy>=1.26.0",
    "aiofiles>=23.2.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist", "app/db/migrations"]
