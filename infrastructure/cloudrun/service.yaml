apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: legal-ai-backend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/legal-ai-backend:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: APPLICATION_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: legal-ai-secrets
                  key: database_url
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: legal-ai-secrets
                  key: gemini_api_key
            - name: STORAGE_BACKEND
              value: "gcs"
            - name: GCS_BUCKET_NAME
              value: "legal-ai-documents"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
